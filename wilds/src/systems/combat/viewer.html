<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combat model viewer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9cc4dc}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "three": "../../../lib/three.module.js", "three/addons/": "../../../lib/addons/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Dev-only turntable for combat assets (fast to screenshot headless): ?mode=roster|weapons|camp|poses
import * as THREE from 'three';
import { buildGnarl, buildShellback, buildStonewarden, buildWisp } from './models.js';
import { createCreatureAnimator } from './anim.js';
import { WEAPONS, buildWeaponMesh } from './weapons.js';
import { buildCamp } from './camps.js';
import { makeGlowTexture, createVfx } from './vfx.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'roster';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc4dc);
scene.fog = new THREE.Fog(0xa8c4d0, 40, 160);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 500);
const uniforms = {
  uTime: { value: 0 }, uSunDir: { value: new THREE.Vector3(0.5, 0.8, 0.4).normalize() }, uSunColor: { value: new THREE.Color(1, 0.95, 0.85) },
  uSkyColor: { value: new THREE.Color(0.55, 0.72, 0.95) }, uGroundColor: { value: new THREE.Color(0.35, 0.33, 0.25) }, uWetness: { value: 0 },
};
const sun = new THREE.DirectionalLight(0xfff1dc, 3.2); sun.position.copy(uniforms.uSunDir.value).multiplyScalar(40);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, far: 120 }); sun.shadow.bias = -0.0005;
scene.add(sun, new THREE.HemisphereLight(0xbcd8f0, 0x6a7a4a, 1.2));
const world = { getHeight: (x, z) => 0, getNormal: (x, z, o = {}) => Object.assign(o, { x: 0, y: 1, z: 0 }) };
const ctx = { THREE, scene, camera, uniforms, world, renderer, __combatGlowTex: makeGlowTexture() };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ color: 0x8cb04a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const anims = [];
const t0 = +(q.get('t') || 2.0);
if (mode === 'roster' || mode === 'poses') {
  const items = [];
  const tiers = ['moss', 'ember', 'dusk', 'bone'];
  tiers.forEach((t, i) => items.push(buildGnarl(ctx, t, i + 1)));
  items.push(buildShellback(ctx, 'teal', 7)); items.push(buildShellback(ctx, 'amber', 8));
  items.push(buildStonewarden(ctx, 9));
  const xs = [-5.2, -3.6, -2.0, -0.4, 1.8, 4.6, 9.4];
  const poses = ['idle', 'combat', 'loco', 'sit', 'sleep', 'idle', 'idle'];
  const acts = { 1: 'swing', 4: 'slam', 5: 'charge' };
  items.forEach((c, i) => {
    c.root.position.set(xs[i], 0, i % 2 ? 0.6 : 0); c.root.rotation.y = q.get('yaw') ? +q.get('yaw') : (mode === 'poses' ? 0.3 : -0.35); scene.add(c.root);
    const a = createCreatureAnimator(c, { seed: i, amp: c.kind === 'stonewarden' ? 0.85 : 1 });
    if (mode === 'poses') { a.setBase(poses[i]); if (acts[i]) a.play(acts[i], 1, true); }
    anims.push({ a, c, i });
  });
  ['ember', 'frost', 'storm'].forEach((k, i) => { const w = buildWisp(ctx, k); w.root.position.set(-6 + i * 1.6, 3.6, -3); scene.add(w.root); });
  if (q.get('armed')) {
    const w1 = buildWeaponMesh(ctx, 'spiked_bough'); items[0].socketR.add(w1); w1.rotation.x = -0.35;
    const w2 = buildWeaponMesh(ctx, 'gnarl_pike'); items[1].socketR.add(w2); w2.rotation.x = -0.35; w2.position.z = -0.45;
    const w3 = buildWeaponMesh(ctx, 'gnarl_cleaver'); items[2].socketR.add(w3); w3.rotation.x = -0.35;
    const w4 = buildWeaponMesh(ctx, 'horn_bow'); items[3].socketL.add(w4);
  }
  camera.position.set(1.5, 3.2, 15); camera.lookAt(1.5, 1.6, 0);
} else if (mode === 'weapons') {
  Object.keys(WEAPONS).forEach((id, i) => {
    const m = buildWeaponMesh(ctx, id);
    m.position.set(-3.3 + (i % 6) * 1.3, 1.5 - Math.floor(i / 6) * 1.7, 0);
    m.rotation.set(-Math.PI / 2, 0, 0.0);
    if (WEAPONS[id].type === 'spear') { m.scale.setScalar(0.55); m.position.y -= 0.4; }
    if (WEAPONS[id].type === 'shield') m.rotation.set(Math.PI * 0.5 + 0.3, 0, 0);
    if (WEAPONS[id].type === 'bow') m.rotation.set(0, Math.PI / 2, 0);
    scene.add(m);
  });
  camera.position.set(0, 0.6, 7); camera.lookAt(0, 0.4, 0);
} else if (mode === 'fx') {
  const fx = createVfx(ctx);
  window.__fx = fx;
  for (let i = 0; i < 60; i++) { fx.fire(0, 0, 0, 0.05, 1); fx.update(0.05); }
  fx.sparks(new THREE.Vector3(-2, 1.2, 0), null, 20);
  fx.poof(new THREE.Vector3(2.5, 0.6, 0), 1);
  fx.explosion(new THREE.Vector3(6, 0.5, -3), 1);
  fx.shatter(new THREE.Vector3(-4, 1, 0));
  fx.update(0.08);
  camera.position.set(0, 2.5, 9); camera.lookAt(0, 1, 0);
} else if (mode === 'camp') {
  const camp = buildCamp(ctx, { x: 0, z: 0, seed: 11, r: 13, entrance: 2.4 }, { glowTex: makeGlowTexture() });
  camp.group.position.set(0, 0, 0); scene.add(camp.group);
  camera.position.set(Math.sin(2.4) * 30, 12, Math.cos(2.4) * 30); camera.lookAt(0, 1, 0);
  Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30 });
}
if (q.get('cam')) { const c = q.get('cam').split(',').map(Number); camera.position.set(c[0], c[1], c[2]); camera.lookAt(c[3], c[4], c[5]); }
sun.shadow.camera.updateProjectionMatrix();
let t = 0;
function frame() {
  for (const { a } of anims) a.update(1.0, t0);
  renderer.render(scene, camera);
}
for (let i = 0; i < 2; i++) frame();
window.__shotReady = true;
</script>
</body>
</html>
